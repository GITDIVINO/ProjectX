html+=`${ship.errors.length||ship.remaining.some(x=>x.quantity===null||Math.abs(x.quantity)>.01)?'<p class="notice">The cargo plan is incomplete or exceeds limits. The financial result does not confirm voyage feasibility.</p>':''}<p class="form-note">This is a vessel cost model. Under voyage chartering, the exporter budget consists of contractual freight and applicable surcharges: do not add hire and bunkers from this model again.</p></section><section><div class="heading"><h2>5. Cost by sale</h2>${select('allocation','Allocation method',[['route','By legs and ports'],['tonnage','Entire budget by tonnage']])}</div>${b?table(['Sale','Port','Tonnage','Allocated, USD','USD/t'],b.allocation.map(a=>{const l=state.lots.find(l=>l.id===a.id);return `<tr><td class="name"><span class="tag" style="background:${l.color}"></span>${esc(l.name)}</td><td>${esc(l.port)}</td><td>${fmt(a.quantity,0)}</td><td>${fmt(a.cents/100,2)}</td><td>${fmt(a.cents/100/a.quantity,2)}</td></tr>`;})):'<p class="empty">Allocation appears after the voyage calculation is complete.</p>'}<p class="form-note">Proposed method: leg costs — to cargo on board; port call costs — to handled sales; ballast and additional items — to all cargo. This is allocated cost, not the incremental cost of adding a sale.</p><details id="notes"><summary>Calculation sources and notes</summary><textarea data-path="notes" aria-label="Calculation sources" placeholder="Enter sources and dates for distances, PDA, rates, SF and vessel data">${esc(state.notes)}</textarea></details></section>`;
$('app').innerHTML=html;open.forEach(id=>{if($(id))$(id).open=true;});}
function ensureLegs(){state.vesselId??='tbn-1';M.ensureCatalogs(state);M.anonymizeProfiles(state);M.migrateBaltic(state);M.syncRoute(state);}
function changed(){ensureLegs();$('status').textContent='';render();}
function editableLotField(path){return !path?.startsWith('lots.')||/^lots\.\d+\.selected$/.test(path);}
$('app').addEventListener('change',e=>{const el=e.target;if(!editableLotField(el.dataset.path)){$('status').textContent='Cargo properties are read-only in PLANNER. Edit them in CARGO.';render();return;}if(el.dataset.path==='vesselId'){try{M.applyVessel(state,el.value);changed();}catch(error){$('status').textContent=error.message;render();}return;}if(el.dataset.path){let value=el.type==='checkbox'?el.checked:el.type==='number'?(el.value===''?null:Number(el.value)):el.value;if(el.dataset.path.startsWith('sales.')){
 const [,index,fieldName]=el.dataset.path.split('.');
 try{M.updateSale(state,state.sales[Number(index)].id,{[fieldName]:value});changed();}catch(error){render();$('status').textContent=error.message;}
 return;
}
if(el.dataset.path.startsWith('portRecords.')){
 const [,index,fieldName]=el.dataset.path.split('.');
 try{M.updatePortRecord(state,Number(index),fieldName,value);changed();}catch(error){render();$('status').textContent=error.message;}
 return;
}
if(el.dataset.path.startsWith('cargoTypes.')&&el.dataset.path.endsWith('.sf')&&!M.ok(value,true)){el.value=get(el.dataset.path);$('status').textContent='Enter a positive planning SF';return;}
set(el.dataset.path,value);if(el.dataset.path.endsWith('.sf')){const prefix=el.dataset.path.slice(0,-3);set(prefix+'.sfBasis','user-entered');}if(el.dataset.path.endsWith('.selected'))state.allocations=state.allocations.filter(a=>chosen().some(l=>l.id===a.lot));if(el.dataset.path.startsWith('sales.'))M.syncSalesToLots(state);changed();}else if(el.dataset.lot){const quantity=el.value===''?0:Number(el.value),lot=el.dataset.lot,hold=Number(el.dataset.hold);if(!M.ok(quantity)){el.value='';$('status').textContent='Enter non-negative tonnage';return;}state.allocations=state.allocations.filter(a=>!(a.lot===lot&&a.hold===hold));if(quantity>0)state.allocations.push({lot,hold,quantity});changed();}});
function focusHold(target){const h=target.closest('[data-hold-target]');if(!h)return false;const cell=document.querySelector('input[data-hold="'+h.dataset.holdTarget+'"]:not(:disabled)');if(cell){cell.focus();cell.select();}return true;}
$('app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-hold-target]')){e.preventDefault();focusHold(e.target);}});
$('app').addEventListener('click',e=>{if(focusHold(e.target))return;const el=e.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){case'new-sale':showSaleDialog();return;case'new-port':state.portRecords.push({id:'P'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name:'',terminal:'',restrictions:'',da:null});break;case'remove-sale':{const sale=state.sales[Number(el.dataset.index)];if(state.lots.some(l=>l.saleId===sale.id)){$('status').textContent='First remove the sale from PLANNER';return;}state.sales.splice(Number(el.dataset.index),1);break;}case'remove-port-record':try{M.removePortRecord(state,Number(el.dataset.index));}catch(error){$('status').textContent=error.message;return;}break;case'new-vessel':M.addVesselType(state);changed();$('status').textContent='';return;case'add-hold':{const v=state.vesselProfiles.find(v=>v.id===el.dataset.id);v.holdData.push({id:v.holdData.length+1,volume:null,massLimit:null});v.holds=v.holdData.length;break;}case'remove-hold':{const v=state.vesselProfiles.find(v=>v.id===el.dataset.id);if(v.holdData.length>1){v.holdData.pop();v.holds=v.holdData.length;}break;}case'new-cargo':showCargoDialog();return;case'apply-cargo':try{M.applyCargo(state,el.dataset.id);changed();$('status').textContent='';}catch(error){$('status').textContent=error.message;}return;case'apply-vessel':try{M.applyVessel(state,el.dataset.id);changed();$('status').textContent='';}catch(error){$('status').textContent=error.message;}return;case'add-lot':showLotDialog();return;case'remove-lot':{const l=state.lots[Number(el.dataset.index)];state.allocations=state.allocations.filter(a=>a.lot!==l.id);state.lots.splice(Number(el.dataset.index),1);break;}case'allocate':if(state.allocations.length&&!confirm('Replace manual stowage with volume-based allocation?'))return;state.allocations=M.allocate(state);break;case'move-port':M.moveCall(state,el.dataset.port,Number(el.dataset.direction));break;case'add-cost':state.costs.push({name:'Additional item',amount:null,days:0,burn:2.7,fuel:'main'});break;case'remove-cost':state.costs.splice(Number(el.dataset.index),1);break;}changed();if(el.dataset.action==='add-cost')$('costs').open=true;});
function saveCalculation(){
 try{
  const previous=localStorage.getItem(key);
  if(previous){try{readSave(previous);localStorage.setItem(backupKey,previous);}catch{}}
  localStorage.setItem(key,JSON.stringify(state));$('status').textContent='';return true;
 }catch{$('status').textContent='Storage is unavailable. Your changes have not been saved.';return false;}
}
$('save').onclick=saveCalculation;

$('reset').onclick=()=>{if(!confirm('Clear the current calculation and its local save?'))return;const catalogs={cargoTypes:state.cargoTypes,vesselProfiles:state.vesselProfiles,sales:state.sales,portRecords:state.portRecords};state=M.initial();Object.assign(state,catalogs);ensureLegs();try{localStorage.setItem(key,JSON.stringify(state));}catch{}$('status').textContent='';render();};
$('pdf').onclick=()=>{window.print();};
function showLotDialog(){const available=state.sales.filter(s=>!state.lots.some(l=>l.saleId===s.id));const dialog=document.createElement('dialog');dialog.innerHTML=`<form id="lot-form"><div class="heading"><h2>Add sale</h2><button type="button" id="close-lot" aria-label="Close">×</button></div>${available.length?`<label class="field">Sale<select name="saleId" required>${available.map(s=>`<option value="${esc(s.id)}">${esc(s.id+' · '+s.cargoName+' · '+fmt(s.quantity,3)+' MT · '+s.loadPort+' → '+s.dischargePort)}</option>`).join('')}</select></label>`:'<p class="empty">No sales available. First add a sale in SALE.</p>'}<p id="lot-error" class="error" role="alert"></p><button type="submit" class="primary" ${available.length?'':'disabled'}>Add to voyage</button></form>`;document.body.appendChild(dialog);dialog.querySelector('#close-lot').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);try{M.addSaleToPlanner(state,f.get('saleId'));dialog.close();changed();}catch(error){dialog.querySelector('#lot-error').textContent=error.message;}};dialog.showModal();}
function showSaleDialog(){const ports=[...new Set(state.portRecords.map(p=>p.name?.trim()).filter(Boolean))],portOptions='<option value="">Select port</option>'+ports.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join(''),dialog=document.createElement('dialog');dialog.innerHTML=`<form id="sale-form"><div class="heading"><h2>New sale</h2><button type="button" id="close-sale" aria-label="Close">×</button></div><div class="grid"><label class="field">Deal date<input name="dealDate" type="date" required></label><label class="field">Cargo<select name="cargoId" required>${state.cargoTypes.filter(c=>M.isBulkCargo(c)&&M.ok(c.sf,true)).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label class="field">Volume, MT<input name="quantity" type="number" min="0.001" step="any" required></label><label class="field">Price FOB, USD/MT<input name="fob" type="number" min="0" step="any" required></label><label class="field">Load port<select name="loadPort" required>${portOptions}</select></label><label class="field">Discharge port<select name="dischargePort" required>${portOptions}</select></label><label class="field">Shipment from<input name="shipmentFrom" type="date" required></label><label class="field">Shipment to<input name="shipmentTo" type="date" required></label></div><p id="sale-error" class="error" role="alert">${ports.length?'':'First add ports in PORT.'}</p><button type="submit" class="primary" ${ports.length?'':'disabled'}>Add sale</button></form>`;document.body.appendChild(dialog);dialog.querySelector('#close-sale').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);try{M.addSale(state,{dealDate:f.get('dealDate'),cargoId:f.get('cargoId'),quantity:Number(f.get('quantity')),fob:Number(f.get('fob')),loadPort:f.get('loadPort'),dischargePort:f.get('dischargePort'),shipmentFrom:f.get('shipmentFrom'),shipmentTo:f.get('shipmentTo')});dialog.close();changed();}catch(error){dialog.querySelector('#sale-error').textContent=error.message;}};dialog.showModal();}
function showCargoDialog(){
 const dialog=document.createElement('dialog');
 dialog.innerHTML='<form><div class="heading"><h2>New bulk cargo</h2><button type="button" data-close aria-label="Close">×</button></div><div class="grid"><label class="field">Cargo name<input name="name" required></label><label class="field">Planning SF, m³/t<input name="sf" type="number" min="0.000001" step="any" required></label><label class="field">IMSBC group<select name="group"><option value="">Pending</option><option>A</option><option>B</option><option>C</option><option>A &amp; B</option></select></label></div><p class="error" role="alert"></p><button type="submit">Add cargo</button></form>';
 document.body.appendChild(dialog);
 dialog.querySelector('[data-close]').onclick=()=>dialog.close();
 dialog.addEventListener('close',()=>dialog.remove());
 dialog.querySelector('form').onsubmit=e=>{
  e.preventDefault();const data=new FormData(e.target),name=String(data.get('name')).trim(),sf=Number(data.get('sf'));
  if(!name||!M.ok(sf,true)){dialog.querySelector('.error').textContent='Enter a cargo name and a positive SF';return;}
  if(state.cargoTypes.some(c=>c.name.toLowerCase()===name.toLowerCase())){dialog.querySelector('.error').textContent='This cargo name already exists';return;}
  let n=1;while(state.cargoTypes.some(c=>c.id==='cargo-'+n))n++;
  state.cargoTypes.push({id:'cargo-'+n,name,sf,physicalForm:'solid',group:data.get('group'),sfBasis:'user-entered',source:'User-entered'});
  dialog.close();changed();
 };dialog.showModal();
}
function cargoDetails(c){const range=v=>v?v.map(n=>Number(n).toLocaleString('en-GB',{maximumFractionDigits:4})).join('–'):'SDS required';const link=(url,label)=>url&&/^https:\/\//.test(url)?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:'';return `<details class="cargo-properties"><summary>${esc(c.propertyStatus||'Properties required')}</summary><dl><dt>BCSN</dt><dd>${esc(c.bcsn||'Shipper declaration required')}</dd><dt>Reference SF, m³/t</dt><dd>${esc(range(c.sfRange))}</dd><dt>Bulk density, kg/m³</dt><dd>${esc(range(c.bulkDensityRange))}</dd><dt>Angle of repose</dt><dd>${esc(c.angleOfRepose||'Not established')}</dd><dt>Applicability</dt><dd>${esc(c.propertyNote||'Confirm the exact product and shipping conditions.')}</dd></dl>${link(c.propertyUrl,'Property source')} ${link(c.sdsUrl,'SDS')} ${link(c.catalogUrl,'Product catalogue')}</details>`;}
function renderCatalog(){M.ensureCatalogs(state);if(currentTab==='sale'){$('app').innerHTML=`<section><div class="heading"><div><h2>SALE</h2><p class="section-intro">Register of concluded sales for voyage planning.</p></div><button data-action="new-sale">+ Add sale</button></div>${state.sales.length?table(['Deal','Date','Cargo','Volume, MT','Loading','Discharge','Shipment','FOB, USD/MT',''],state.sales.map((s,i)=>`<tr><td>${esc(s.id)}</td><td>${input('sales.'+i+'.dealDate','Deal date',{type:'date'})}</td><td class="name">${esc(s.cargoName)}</td><td>${input('sales.'+i+'.quantity','Sale quantity')}</td><td>${select('sales.'+i+'.loadPort','Load port',state.portRecords.filter(p=>p.name.trim()).map(p=>[p.name,p.name]))}</td><td>${select('sales.'+i+'.dischargePort','Discharge port',state.portRecords.filter(p=>p.name.trim()).map(p=>[p.name,p.name]))}</td><td><div class="date-range">${input('sales.'+i+'.shipmentFrom','Shipment from',{type:'date'})}${input('sales.'+i+'.shipmentTo','Shipment to',{type:'date'})}</div></td><td>${input('sales.'+i+'.fob','Price FOB')}</td><td><button data-action="remove-sale" data-index="${i}" aria-label="Remove sale ${esc(s.id)}">×</button></td></tr>`)):'<div class="empty-state"><strong>No sales yet</strong><span>Add the first deal. Cargo is selected from CARGO only.</span></div>'}<p class="form-note">A sale already added to PLANNER cannot be deleted until it is removed from the voyage.</p></section>`;return;}if(currentTab==='ports'){$('app').innerHTML=`<section><div class="heading"><div><h2>PORT</h2><p class="section-intro">Charterer port and terminal register.</p></div><button data-action="new-port">+ Add port</button></div>${table(['Port','Terminal','Restrictions','DA, USD',''],state.portRecords.map((p,i)=>`<tr><td>${input('portRecords.'+i+'.name','Port name',{type:'text'})}</td><td>${input('portRecords.'+i+'.terminal','Terminal',{type:'text'})}</td><td class="wide-cell">${input('portRecords.'+i+'.restrictions','Restrictions',{type:'text'})}</td><td>${input('portRecords.'+i+'.da','DA')}</td><td><button data-action="remove-port-record" data-index="${i}" aria-label="Remove port ${esc(p.name)}">×</button></td></tr>`))}<p class="form-note">DA from the register is used as the initial value for a new call. Restrictions are reference information and do not constitute technical approval of a call.</p></section>`;return;}if(currentTab==='cargo'){$('app').innerHTML=`<section><div class="heading"><div><h2>CARGO</h2><p class="section-intro">Cargo register for creating sales.</p></div><button data-action="new-cargo">+ Add cargo type</button></div><div class="catalog-toolbar"><input id="cargo-search" type="search" aria-label="Search cargo" placeholder="Name, grade, manufacturer" class="catalog-search"><select id="cargo-family" aria-label="Cargo category"><option value="">All categories</option>${[...new Set(state.cargoTypes.filter(c=>M.isBulkCargo(c)&&M.ok(c.sf,true)).map(c=>c.family||'Other cargoes'))].map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>${table(['Cargo','Planning SF, m³/t','IMSBC Group'],state.cargoTypes.map((c,i)=>({c,i})).filter(({c})=>M.isBulkCargo(c)&&M.ok(c.sf,true)).map(({c,i})=>`<tr data-family="${esc(c.family||'Other cargoes')}" data-catalog-name="${esc([c.name,c.aliases,c.producer,c.family].filter(Boolean).join(' ').toLowerCase())}"><td class="cargo-name-cell">${input('cargoTypes.'+i+'.name','Cargo name',{type:'text'})}</td><td class="cargo-sf-cell">${input('cargoTypes.'+i+'.sf','Planning stowage factor',{disabled:!M.isBulkCargo(c)})}</td><td class="cargo-group-cell">${select('cargoTypes.'+i+'.group','IMSBC group',[['',M.isBulkCargo(c)?'Pending':'N/A'],'A','B','C','A & B'])}</td></tr>`))}<p class="form-note">Planning SF is a reference estimate and must be confirmed for the shipment. IMSBC Group must match the exact product.</p></section>`;return;}
$('app').innerHTML='<div class="heading"><h2>Vessel types</h2><button data-action="new-vessel">+ Add vessel type</button></div>'+state.vesselProfiles.map((v,i)=>{const path='vesselProfiles.'+i;return `<section><div class="heading"><h2>VESSEL · ${esc(v.name)}</h2><button data-action="apply-vessel" data-id="${esc(v.id)}">Apply to voyage</button></div>${v.referenceNote?`<p class="form-note">${esc(v.referenceNote)}</p>`:""}<div class="grid">${[['name','Name'],['direction','Direction'],['model','Model'],['source','Parameter source']].map(([k,l])=>field(path+'.'+k,l,{type:'text'})).join('')}${[['dwt','DWT, MT'],['draft','Draft SSW, m'],['tpc','TPC, t/cm'],['loa','LOA, m'],['beam','Beam, m'],['grain','Grain, m³'],['bale','Bale documented maximum, m³'],['gt','GT'],['nrt','NRT'],['tanktop','Tank top, t/m²']].map(([k,l])=>field(path+'.'+k,l)).join('')}</div><h3>Speed and consumption</h3><div class="grid">${[['speed','Laden, kn'],['burn','Laden, t/day'],['ballastSpeed','Ballast, kn'],['ballastBurn','Ballast, t/day'],['working','Port main working, t/day'],['idle','Port main idle, t/day'],['auxWorking','Port Aux working, t/day'],['auxIdle','Port Aux idle, t/day'],['boiler','Boiler, t/day'],['ecaBurn','ECA, t/day'],['aux','Additional Aux, t/day']].map(([k,l])=>field(path+'.'+k,l)).join('')}</div><div class="heading"><h3>Holds · ${v.holdData.length}</h3><div><button data-action="add-hold" data-id="${esc(v.id)}">+ Hold</button> <button data-action="remove-hold" data-id="${esc(v.id)}" ${v.holdData.length<=1?'disabled':''}>Remove last</button></div></div>${table(['Hold','Volume grain, m³','Mass limit, MT'],v.holdData.map((h,j)=>`<tr><td>№${h.id}</td><td>${input(path+'.holdData.'+j+'.volume','Hold volume '+h.id)}</td><td>${input(path+'.holdData.'+j+'.massLimit','Hold mass '+h.id)}</td></tr>`))}<p class="form-note">An empty mass limit means no data is available. Boiler operating days and fuel are set separately in the calculation.</p><p class="form-note">Applying updates DWT, holds and consumption profiles of the current voyage. Rates, distances, port handling rates and deductions are preserved; stowage must be checked again.</p></section>`;}).join('');}
function setupChrome(){if(document.documentElement)document.documentElement.lang='en';}
function syncWorkspace(){for(const name of tabs)$('tab-'+name).setAttribute('aria-selected',String(name===currentTab));const outsidePlanner=currentTab!=='planner';$('planner-actions').hidden=outsidePlanner;$('planner-footer').hidden=false;if($('reset-top'))$('reset-top').hidden=outsidePlanner;}
for(const tab of tabs)$('tab-'+tab).onclick=()=>{currentTab=tab;try{sessionStorage.setItem(tabKey,tab);}catch{}syncWorkspace();render();};
function filterCargo(){const q=($('cargo-search')?.value||'').toLowerCase().trim();const family=$('cargo-family')?.value||'';document.querySelectorAll('[data-catalog-name]').forEach(row=>row.hidden=!(q.split(/\s+/).every(word=>row.dataset.catalogName.includes(word))&&(!family||row.dataset.family===family)));}
$('app').addEventListener('input',e=>{if(e.target.id==='cargo-search')filterCargo();});
$('app').addEventListener('change',e=>{if(e.target.id==='cargo-family')filterCargo();});

if(document.addEventListener){document.addEventListener('invalid',e=>{const el=e.target;if(el.setCustomValidity)el.setCustomValidity(el.validity.valueMissing?'Complete this field.':'Enter a valid value for this field.');},true);document.addEventListener('input',e=>{if(e.target.setCustomValidity)e.target.setCustomValidity('');},true);}
window.ProjectXApp={getState:()=>JSON.parse(JSON.stringify(state)),getResult:()=>M.compute(state)};ensureLegs();setupChrome();syncWorkspace();render();if(startupMessage)$('status').textContent=startupMessage;
})();
</script>
