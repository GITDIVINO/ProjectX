function focusHold(target){const h=target.closest('[data-hold-target]');if(!h)return false;const cell=document.querySelector('input[data-hold="'+h.dataset.holdTarget+'"]:not(:disabled)');if(cell){cell.focus();cell.select();}return true;}
$('app').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-hold-target]')){e.preventDefault();focusHold(e.target);}});
$('app').addEventListener('click',e=>{if(focusHold(e.target))return;const el=e.target.closest('[data-action]');if(!el)return;switch(el.dataset.action){case'new-sale':showSaleDialog();return;case'new-port':state.portRecords.push({id:'P'+(state.portRecords.length+1),name:'',terminal:'',restrictions:'',da:null});break;case'remove-sale':{const sale=state.sales[Number(el.dataset.index)];if(state.lots.some(l=>l.saleId===sale.id)){$('status').textContent='Сначала уберите продажу из PLANNER';return;}state.sales.splice(Number(el.dataset.index),1);break;}case'remove-port-record':state.portRecords.splice(Number(el.dataset.index),1);break;case'new-vessel':M.addVesselType(state);changed();$('status').textContent='';return;case'add-hold':{const v=state.vesselProfiles.find(v=>v.id===el.dataset.id);v.holdData.push({id:v.holdData.length+1,volume:null,massLimit:null});v.holds=v.holdData.length;break;}case'remove-hold':{const v=state.vesselProfiles.find(v=>v.id===el.dataset.id);if(v.holdData.length>1){v.holdData.pop();v.holds=v.holdData.length;}break;}case'new-cargo':{let n=1;while(state.cargoTypes.some(c=>c.id==='cargo-'+n))n++;state.cargoTypes.push({id:'cargo-'+n,name:'New cargo',sf:null,group:'',un:'',onlyHold:null,source:''});break;}case'apply-cargo':try{M.applyCargo(state,el.dataset.id);changed();$('status').textContent='';}catch(error){$('status').textContent=error.message;}return;case'apply-vessel':try{M.applyVessel(state,el.dataset.id);changed();$('status').textContent='';}catch(error){$('status').textContent=error.message;}return;case'add-lot':showLotDialog();return;case'remove-lot':{const l=state.lots[Number(el.dataset.index)];state.allocations=state.allocations.filter(a=>a.lot!==l.id);state.lots.splice(Number(el.dataset.index),1);break;}case'allocate':if(state.allocations.length&&!confirm('Заменить ручное размещение расчётом по объёму?'))return;state.allocations=M.allocate(state);break;case'move-port':M.moveCall(state,el.dataset.port,Number(el.dataset.direction));break;case'add-cost':state.costs.push({name:'Дополнительная статья',amount:null,days:0,burn:2.7,fuel:'main'});break;case'remove-cost':state.costs.splice(Number(el.dataset.index),1);break;}changed();if(el.dataset.action==='add-cost')$('costs').open=true;});
$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent='';}catch{$('status').textContent='Хранилище недоступно.';}};

$('reset').onclick=()=>{if(!confirm('Очистить текущий расчёт и его локальное сохранение?'))return;const catalogs={cargoTypes:state.cargoTypes,vesselProfiles:state.vesselProfiles,sales:state.sales,portRecords:state.portRecords};state=M.initial();Object.assign(state,catalogs);ensureLegs();try{localStorage.setItem(key,JSON.stringify(state));}catch{}$('status').textContent='';render();};
$('pdf').onclick=()=>{window.print();};
function showLotDialog(){const available=state.sales.filter(s=>!state.lots.some(l=>l.saleId===s.id));const dialog=document.createElement('dialog');dialog.innerHTML=`<form id="lot-form"><div class="heading"><h2>Добавить продажу</h2><button type="button" id="close-lot" aria-label="Закрыть">×</button></div>${available.length?`<label class="field">Продажа<select name="saleId" required>${available.map(s=>`<option value="${esc(s.id)}">${esc(s.id+' · '+s.cargoName+' · '+fmt(s.quantity,3)+' MT · '+s.loadPort+' → '+s.dischargePort)}</option>`).join('')}</select></label>`:'<p class="empty">Нет доступных продаж. Сначала добавьте продажу во вкладке SALE.</p>'}<p id="lot-error" class="error" role="alert"></p><button type="submit" class="primary" ${available.length?'':'disabled'}>Добавить в рейс</button></form>`;document.body.appendChild(dialog);dialog.querySelector('#close-lot').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);try{M.addSaleToPlanner(state,f.get('saleId'));dialog.close();changed();}catch(error){dialog.querySelector('#lot-error').textContent=error.message;}};dialog.showModal();}
function showSaleDialog(){const ports=[...new Set(state.portRecords.map(p=>p.name?.trim()).filter(Boolean))],portOptions='<option value="">Выберите порт</option>'+ports.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join(''),dialog=document.createElement('dialog');dialog.innerHTML=`<form id="sale-form"><div class="heading"><h2>Новая продажа</h2><button type="button" id="close-sale" aria-label="Закрыть">×</button></div><div class="grid"><label class="field">Дата сделки<input name="dealDate" type="date" required></label><label class="field">Груз<select name="cargoId" required>${state.cargoTypes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label class="field">Объём, MT<input name="quantity" type="number" min="0.001" step="any" required></label><label class="field">Цена FOB, USD/MT<input name="fob" type="number" min="0" step="any" required></label><label class="field">Порт погрузки<select name="loadPort" required>${portOptions}</select></label><label class="field">Порт выгрузки<select name="dischargePort" required>${portOptions}</select></label><label class="field">Отгрузка с<input name="shipmentFrom" type="date" required></label><label class="field">Отгрузка по<input name="shipmentTo" type="date" required></label></div><p id="sale-error" class="error" role="alert">${ports.length?'':'Сначала добавьте порты во вкладке PORTS.'}</p><button type="submit" class="primary" ${ports.length?'':'disabled'}>Добавить продажу</button></form>`;document.body.appendChild(dialog);dialog.querySelector('#close-sale').onclick=()=>dialog.close();dialog.addEventListener('close',()=>dialog.remove());dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);try{M.addSale(state,{dealDate:f.get('dealDate'),cargoId:f.get('cargoId'),quantity:Number(f.get('quantity')),fob:Number(f.get('fob')),loadPort:f.get('loadPort'),dischargePort:f.get('dischargePort'),shipmentFrom:f.get('shipmentFrom'),shipmentTo:f.get('shipmentTo')});dialog.close();changed();}catch(error){dialog.querySelector('#sale-error').textContent=error.message;}};dialog.showModal();}
function cargoDetails(c){const range=v=>v?v.map(n=>Number(n).toLocaleString('en-GB',{maximumFractionDigits:4})).join('–'):'SDS required';const link=(url,label)=>url&&/^https:\/\//.test(url)?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:'';return `<details class="cargo-properties"><summary>${esc(c.propertyStatus||'Properties required')}</summary><dl><dt>BCSN</dt><dd>${esc(c.bcsn||'Shipper declaration required')}</dd><dt>Reference SF, m³/t</dt><dd>${esc(range(c.sfRange))}</dd><dt>Bulk density, kg/m³</dt><dd>${esc(range(c.bulkDensityRange))}</dd><dt>Angle of repose</dt><dd>${esc(c.angleOfRepose||'Not established')}</dd><dt>Applicability</dt><dd>${esc(c.propertyNote||'Confirm the exact product and shipping conditions.')}</dd></dl>${link(c.propertyUrl,'Property source')} ${link(c.sdsUrl,'SDS')} ${link(c.catalogUrl,'Product catalogue')}</details>`;}
function renderCatalog(){M.ensureCatalogs(state);if(currentTab==='sale'){$('app').innerHTML=`<section><div class="heading"><div><h2>SALE</h2><p class="section-intro">Реестр заключённых продаж для формирования рейсов.</p></div><button data-action="new-sale">+ Добавить продажу</button></div>${state.sales.length?table(['Сделка','Дата','Груз','Объём, MT','Погрузка','Выгрузка','Отгрузка','FOB, USD/MT',''],state.sales.map((s,i)=>`<tr><td>${esc(s.id)}</td><td>${input('sales.'+i+'.dealDate','Дата сделки',{type:'date'})}</td><td class="name">${esc(s.cargoName)}</td><td>${input('sales.'+i+'.quantity','Объём продажи')}</td><td>${input('sales.'+i+'.loadPort','Порт погрузки',{type:'text'})}</td><td>${input('sales.'+i+'.dischargePort','Порт выгрузки',{type:'text'})}</td><td><div class="date-range">${input('sales.'+i+'.shipmentFrom','Отгрузка с',{type:'date'})}${input('sales.'+i+'.shipmentTo','Отгрузка по',{type:'date'})}</div></td><td>${input('sales.'+i+'.fob','Цена FOB')}</td><td><button data-action="remove-sale" data-index="${i}" aria-label="Удалить продажу ${esc(s.id)}">×</button></td></tr>`)):'<div class="empty-state"><strong>Продаж пока нет</strong><span>Добавьте первую сделку. Наименование груза выбирается только из CARGO.</span></div>'}<p class="form-note">Продажа, уже добавленная в PLANNER, не удаляется до исключения её из рейса.</p></section>`;return;}if(currentTab==='ports'){$('app').innerHTML=`<section><div class="heading"><div><h2>PORTS</h2><p class="section-intro">Рабочий справочник портов и терминалов фрахтователя.</p></div><button data-action="new-port">+ Добавить порт</button></div>${table(['Порт','Терминал','Ограничения','DA, USD',''],state.portRecords.map((p,i)=>`<tr><td>${input('portRecords.'+i+'.name','Название порта',{type:'text'})}</td><td>${input('portRecords.'+i+'.terminal','Терминал',{type:'text'})}</td><td class="wide-cell">${input('portRecords.'+i+'.restrictions','Ограничения',{type:'text'})}</td><td>${input('portRecords.'+i+'.da','DA')}</td><td><button data-action="remove-port-record" data-index="${i}" aria-label="Удалить порт ${esc(p.name)}">×</button></td></tr>`))}<p class="form-note">DA из справочника применяется как начальное значение нового захода. Ограничения остаются справочной информацией и не означают техническое подтверждение захода.</p></section>`;return;}if(currentTab==='cargo'){$('app').innerHTML=`<section><div class="heading"><div><h2>CARGO</h2><p class="section-intro">Справочник грузов для создания продаж.</p></div><button data-action="new-cargo">+ Add cargo type</button></div><div class="catalog-toolbar"><input id="cargo-search" type="search" aria-label="Search cargo" placeholder="Name, grade, manufacturer" class="catalog-search"><select id="cargo-family" aria-label="Cargo category"><option value="">All categories</option>${[...new Set(state.cargoTypes.map(c=>c.family||'Other cargoes'))].map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>${table(['Cargo','Planning SF, m³/t','IMSBC Group'],state.cargoTypes.map((c,i)=>`<tr data-family="${esc(c.family||'Other cargoes')}" data-catalog-name="${esc([c.name,c.aliases,c.producer,c.family].filter(Boolean).join(' ').toLowerCase())}"><td class="cargo-name-cell">${input('cargoTypes.'+i+'.name','Cargo name',{type:'text'})}</td><td class="cargo-sf-cell">${input('cargoTypes.'+i+'.sf','Planning stowage factor',{disabled:!M.isBulkCargo(c)})}</td><td class="cargo-group-cell">${select('cargoTypes.'+i+'.group','IMSBC group',[['',M.isBulkCargo(c)?'Pending':'N/A'],'A','B','C','A & B'])}</td></tr>`))}<p class="form-note">Planning SF is a reference estimate and must be confirmed for the shipment. IMSBC Group must match the exact product.</p></section>`;return;}
$('app').innerHTML='<div class="heading"><h2>Типы судов</h2><button data-action="new-vessel">+ Добавить тип судна</button></div>'+state.vesselProfiles.map((v,i)=>{const path='vesselProfiles.'+i;return `<section><div class="heading"><h2>VESSEL · ${esc(v.name)}</h2><button data-action="apply-vessel" data-id="${esc(v.id)}">Применить к рейсу</button></div><div class="grid">${[['name','Название'],['direction','Направление'],['model','Модель'],['source','Источник параметров']].map(([k,l])=>field(path+'.'+k,l,{type:'text'})).join('')}${[['dwt','DWT, MT'],['draft','Осадка SSW, м'],['tpc','TPC, т/см'],['loa','LOA, м'],['beam','Ширина, м'],['grain','Grain, м³'],['bale','Bale максимум по документу, м³'],['gt','GT'],['nrt','NRT'],['tanktop','Tank top, т/м²']].map(([k,l])=>field(path+'.'+k,l)).join('')}</div><h3>Скорость и расход</h3><div class="grid">${[['speed','Laden, kn'],['burn','Laden, т/сут'],['ballastSpeed','Ballast, kn'],['ballastBurn','Ballast, т/сут'],['working','Port main working, т/сут'],['idle','Port main idle, т/сут'],['auxWorking','Port Aux working, т/сут'],['auxIdle','Port Aux idle, т/сут'],['boiler','Котёл, т/сут'],['ecaBurn','ECA, т/сут'],['aux','Дополнительный Aux, т/сут']].map(([k,l])=>field(path+'.'+k,l)).join('')}</div><div class="heading"><h3>Трюмы · ${v.holdData.length}</h3><div><button data-action="add-hold" data-id="${esc(v.id)}">+ Трюм</button> <button data-action="remove-hold" data-id="${esc(v.id)}" ${v.holdData.length<=1?'disabled':''}>Убрать последний</button></div></div>${table(['Трюм','Объём grain, м³','Допустимая масса, MT'],v.holdData.map((h,j)=>`<tr><td>№${h.id}</td><td>${input(path+'.holdData.'+j+'.volume','Объём трюма '+h.id)}</td><td>${input(path+'.holdData.'+j+'.massLimit','Масса трюма '+h.id)}</td></tr>`))}<p class="form-note">Пустой предел массы означает отсутствие данных. Дни работы котла и его топливо задаются в расчёте отдельно.</p><p class="form-note">Применение обновляет DWT, трюмы и режимы расхода текущего рейса. Ставки, расстояния, портовые нормы и вычеты сохраняются; размещение требуется проверить заново.</p></section>`;}).join('');}
function setupChrome(){const actions=$('planner-actions'),footer=$('planner-footer');$('save').textContent='Save';$('pdf').textContent='Save PDF';if(actions&&document.createElement&&!document.getElementById('reset-top')){const topReset=document.createElement('button');topReset.id='reset-top';topReset.textContent='Clear calculation';topReset.onclick=()=>$('reset').click();actions.appendChild(topReset);}if(footer?.querySelector){const meta=footer.querySelector('.projectx-footer__meta');if(meta?.children?.[2])meta.children[2].textContent='';if(meta?.children?.[4])meta.children[4].hidden=true;}}
function syncWorkspace(){for(const name of tabs)$('tab-'+name).setAttribute('aria-selected',String(name===currentTab));const outsidePlanner=currentTab!=='planner';$('planner-actions').hidden=outsidePlanner;$('planner-footer').hidden=outsidePlanner;if($('reset-top'))$('reset-top').hidden=outsidePlanner;}
const UI_TRANSLATIONS=[['Предварительный расчёт','Preliminary calculation'],['Очистить расчёт','Clear calculation'],['Сохранить PDF','Save PDF'],['Сохранить','Save'],['Добавьте продажи в планировщик','Add sales in SALE to the planner'],['Реестр заключённых продаж для формирования рейсов.','Register of concluded sales for voyage planning.'],['Новая продажа','New sale'],['Добавить продажу','Add sale'],['Порт погрузки','Load port'],['Порт выгрузки','Discharge port'],['Дата сделки','Deal date'],['Груз','Cargo'],['Объём, MT','Quantity, MT'],['Цена FOB, USD/MT','FOB price, USD/MT'],['Отгрузка с','Shipment from'],['Отгрузка по','Shipment to'],['Выберите порт','Select port'],['Рабочий справочник портов и терминалов фрахтователя.','Charterer port and terminal register.'],['Добавьте первую сделку. Наименование груза выбирается только из CARGO.','Add the first deal. Cargo is selected from CARGO only.'],['Продажа, уже добавленная в PLANNER, не удаляется до исключения её из рейса.','A sale already added to PLANNER cannot be removed until it is taken out of the voyage.'],['Продажи в рейсе','Sales in voyage'],['Партии','Sales in voyage'],['Продажа / груз','Sale / cargo'],['Количество','Quantity'],['Погрузка','Load'],['Выгрузка','Discharge'],['Судно и ротация','Vessel and rotation'],['Размещение по трюмам','Stowage by holds'],['Расчёт рейса','Voyage calculation'],['Переходы','Legs'],['Порты','Ports'],['Найм, бункер и фрахт','Hire, bunkers and freight'],['Стоимость по партиям','Cost by sale'],['Добавьте первую сделку.','Add the first deal.']];
function translateUi(){const root=document.getElementById('app');if(!root)return;let html=root.innerHTML;for(const [from,to] of UI_TRANSLATIONS)html=html.split(from).join(to);root.innerHTML=html;}
const rawRender=render;render=()=>{rawRender();translateUi();};
for(const tab of tabs)$('tab-'+tab).onclick=()=>{currentTab=tab;try{sessionStorage.setItem(tabKey,tab);}catch{}syncWorkspace();render();};
function filterCargo(){const q=($('cargo-search')?.value||'').toLowerCase().trim();const family=$('cargo-family')?.value||'';document.querySelectorAll('[data-catalog-name]').forEach(row=>row.hidden=!(q.split(/\s+/).every(word=>row.dataset.catalogName.includes(word))&&(!family||row.dataset.family===family)));}
$('app').addEventListener('input',e=>{if(e.target.id==='cargo-search')filterCargo();});
$('app').addEventListener('change',e=>{if(e.target.id==='cargo-family')filterCargo();});

window.ProjectXApp={getState:()=>JSON.parse(JSON.stringify(state)),getResult:()=>M.compute(state)};ensureLegs();setupChrome();syncWorkspace();render();
})();
</script></body></html>
