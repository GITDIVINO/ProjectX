<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>
<header class="site-header">
<div class="brand-block"><h1>ProjectX</h1><p>Voyage Planner Prototype</p></div>
<div class="workspace-tabs" role="tablist" aria-label="Sections">
<button id="tab-planner" role="tab" aria-selected="true">PLANNER</button>
<button id="tab-forward" role="tab" aria-selected="false">FORWARD</button>
<button id="tab-register" role="tab" aria-selected="false">CALCULATIONS</button><button id="tab-sale" role="tab" aria-selected="false">SALES</button>

</div>
</header>
<main>

</main>
<footer id="planner-footer" class="projectx-footer" aria-label="ProjectX footer"><div class="projectx-footer__inner"><div class="projectx-footer__meta"><span><strong>ProjectX</strong> © 2026 Voyage Planner Prototype</span></div><p class="projectx-footer__credit">A Alexander Pikul production</p></div></footer>
